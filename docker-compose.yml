services:
  web-skyvault:
    build: .
    image: skyvault:latest
    pull_policy: build
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db-skyvault:
        condition: service_healthy
    environment:
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db-skyvault
      - DB_PORT=5432
      - DJANGO_ENV=docker
      - SECRET_KEY=${SECRET_KEY}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-5}
      - AI_FALLBACK_MODEL=${AI_FALLBACK_MODEL:-}
      - AI_FALLBACK_API_KEY=${AI_FALLBACK_API_KEY:-}
      - AI_FALLBACK_BASE_URL=${AI_FALLBACK_BASE_URL:-}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:-all-MiniLM-L6-v2}

  qcluster:
    build: .
    image: skyvault:latest
    pull_policy: build
    command: python manage.py qcluster
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    depends_on:
      web-skyvault:
        condition: service_started
      db-skyvault:
        condition: service_healthy
    environment:
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db-skyvault
      - DB_PORT=5432
      - DJANGO_ENV=docker
      - SKIP_MIGRATIONS=1
      - SECRET_KEY=${SECRET_KEY}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-5}
      - AI_FALLBACK_MODEL=${AI_FALLBACK_MODEL:-}
      - AI_FALLBACK_API_KEY=${AI_FALLBACK_API_KEY:-}
      - AI_FALLBACK_BASE_URL=${AI_FALLBACK_BASE_URL:-}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:-all-MiniLM-L6-v2}


  db-skyvault:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  hf_cache:
